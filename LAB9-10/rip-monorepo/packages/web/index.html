<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIP Web</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "@rip/core": "/node_modules/@rip/core/index.js" } }
    </script>
  </head>
  <body>
    <header class="header">
      <h1>RIP Web</h1>
      <p>Веб-версія застосунку для заявок на спільному ядрі @rip/core</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Додати заявку</h2>
        <div class="form-row">
          <input id="nameInput" type="text" placeholder="Імʼя замовника" />
          <input id="phoneInput" type="tel" placeholder="Телефон, напр. +380501234567" />
        </div>
        <div class="form-row">
          <select id="serviceSelect" aria-label="Послуга"></select>
          <input id="commentInput" type="text" placeholder="Коментар (необовʼязково)" />
        </div>
        <button id="addButton" type="button">Додати заявку</button>
        <p id="message" class="message"></p>
      </section>

      <section class="card">
        <h2>Список заявок</h2>
        <input id="searchInput" class="search" type="text" placeholder="Пошук за текстом" />
        <ul id="applicationsList" class="applications-list"></ul>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>

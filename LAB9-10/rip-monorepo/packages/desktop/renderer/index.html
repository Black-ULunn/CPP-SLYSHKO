<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIP Desktop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>RIP Desktop</h1>
      <p>Десктопна версія застосунку для заявок на спільному ядрі @rip/core</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Додати заявку</h2>
        <div class="form-row">
          <input id="nameInput" type="text" placeholder="Імʼя замовника" />
          <input id="phoneInput" type="tel" placeholder="Телефон, напр. +380501234567" />
        </div>
        <div class="form-row">
          <!-- Назви послуг лише для вибору; допустимість перевіряє ядро -->
          <select id="serviceSelect" aria-label="Послуга">
            <option>Організація поховання</option>
            <option>Кремація</option>
            <option>Ритуальний зал</option>
            <option>Транспорт</option>
            <option>Памʼятники та благоустрій</option>
            <option>Інше</option>
          </select>
          <input id="commentInput" type="text" placeholder="Коментар (необовʼязково)" />
        </div>
        <button id="addButton" type="button">Додати заявку</button>
        <p id="message" class="message"></p>
      </section>

      <section class="card">
        <h2>Список заявок</h2>
        <input id="searchInput" class="search" type="text" placeholder="Пошук за текстом" />
        <ul id="applicationsList" class="applications-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
